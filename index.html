*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh;display:flex}
.sidebar{width:280px;min-width:280px;background:#161b27;border-right:1px solid #2d3748;overflow-y:auto;height:100vh;position:sticky;top:0}
.sidebar-header{padding:20px 16px;border-bottom:1px solid #2d3748;background:#1a2035}

.sidebar-header p{font-size:11px;color:#64748b;margin-top:4px}
.base-url-section{padding:12px 16px;border-bottom:1px solid #2d3748}
.base-url-section label{font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px}
.base-url-section input{width:100%;background:#0f1117;border:1px solid #374151;color:#e2e8f0;padding:6px 8px;border-radius:6px;font-size:11px;margin-top:4px}
.token-section{padding:12px 16px;border-bottom:1px solid #2d3748}
.token-section label{font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px}
.token-section input{width:100%;background:#0f1117;border:1px solid #374151;color:#e2e8f0;padding:6px 8px;border-radius:6px;font-size:10px;margin-top:4px;word-break:break-all}
.group{border-bottom:1px solid #1e2d3d}
.group-header{padding:10px 16px;cursor:pointer;font-size:11px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;justify-content:space-between;user-select:none}
.group-header:hover{background:#1e293b;color:#e2e8f0}
.group-header .badge{background:#1e3a5f;color:#60a5fa;padding:2px 6px;border-radius:10px;font-size:9px}
.group-items{display:none}
.group-items.open{display:block}
.endpoint-btn{display:flex;align-items:center;gap:8px;padding:8px 16px 8px 24px;cursor:pointer;font-size:11px;color:#94a3b8;width:100%;text-align:left;background:none;border:none}
.endpoint-btn:hover{background:#1e293b;color:#e2e8f0}
.endpoint-btn.active{background:#1e3a5f;color:#60a5fa}
.method{font-size:9px;font-weight:700;padding:2px 5px;border-radius:3px;min-width:38px;text-align:center}
.GET{background:#065f46;color:#34d399}
.POST{background:#1e3a5f;color:#60a5fa}
.PATCH{background:#4a1d96;color:#a78bfa}
.PUT{background:#713f12;color:#fbbf24}
.DELETE{background:#7f1d1d;color:#f87171}
.main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.request-panel{padding:24px;border-bottom:1px solid #2d3748;background:#161b27}
.request-title{font-size:18px;font-weight:700;color:#f1f5f9;margin-bottom:4px}
.request-subtitle{font-size:12px;color:#64748b;margin-bottom:16px}
.url-row{display:flex;gap:8px;margin-bottom:12px}
.method-badge{padding:0 14px;border-radius:8px;font-size:12px;font-weight:700;display:flex;align-items:center}
.url-bar{flex:1;background:#0f1117;border:1px solid #374151;color:#e2e8f0;padding:10px 14px;border-radius:8px;font-size:13px;font-family:'Courier New',monospace}
.send-btn{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border:none;padding:10px 24px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;transition:opacity .2s}
.send-btn:hover{opacity:.9}
.send-btn:disabled{opacity:.5;cursor:not-allowed}
.tabs{display:flex;gap:4px;margin-bottom:12px}
.tab{padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;color:#94a3b8;background:none;border:1px solid transparent}
.tab.active{background:#1e293b;color:#e2e8f0;border-color:#374151}
.tab-content{display:none}
.tab-content.active{display:block}
textarea.body-input{width:100%;height:140px;background:#0f1117;border:1px solid #374151;color:#e2e8f0;padding:12px;border-radius:8px;font-family:'Courier New',monospace;font-size:12px;resize:vertical}
.form-file{flex:1;background:#0f1117;border:1px solid #374151;color:#e2e8f0;padding:6px 10px;border-radius:6px;font-size:11px}
.form-actions{display:flex;gap:6px;margin-top:6px}
.response-panel{flex:1;overflow:auto;padding:24px;background:#0f1117}
.response-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.status-badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700}
.status-2xx{background:#065f46;color:#34d399}
.status-4xx{background:#7f1d1d;color:#f87171}
.status-5xx{background:#7c2d12;color:#fb923c}
.response-time{font-size:11px;color:#64748b}
.response-body{background:#161b27;border:1px solid #2d3748;border-radius:8px;padding:16px;font-family:'Courier New',monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;color:#a5f3fc;max-height:500px;overflow:auto}
.copy-btn{margin-left:auto;background:#1e293b;border:1px solid #374151;color:#94a3b8;padding:4px 12px;border-radius:6px;cursor:pointer;font-size:11px}
.copy-btn:hover{color:#e2e8f0}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#4b5563;gap:8px}
.empty-state svg{width:48px;height:48px;opacity:.3}
.var-row{display:flex;gap:8px;margin-bottom:6px}
.var-row input{flex:1;background:#0f1117;border:1px solid #374151;color:#e2e8f0;padding:6px 10px;border-radius:6px;font-size:11px}
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-header">
    <h1>🏛️ MLA API Tester</h1>
    <p>Smart Grievance System v1</p>
  </div>
  <div class="base-url-section">
    <label>Base URL</label>
    <input id="baseUrl" value="https://tvk-backend-ak7l.onrender.com/api/v1"/>
  </div>
  <div class="token-section">
    <label>Bearer Token</label>
    <input id="tokenInput" placeholder="Paste access token here..." style="font-size:9px"/>
  </div>
  <div id="sidebar-groups"></div>
</div>

<div class="main">
  <div class="request-panel">
    <div class="request-title" id="reqTitle">Select an endpoint</div>
    <div class="request-subtitle" id="reqSubtitle">Choose from the sidebar to get started</div>
    <div class="url-row">
      <div class="method-badge" id="reqMethodBadge" style="background:#1e293b;color:#64748b">---</div>
      <input class="url-bar" id="reqUrl" placeholder="Select an endpoint from the sidebar"/>
      <button class="send-btn" onclick="sendRequest()" id="sendBtn">Send</button>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('form')">📋 Form</button>
      <button class="tab" onclick="switchTab('body')">📄 Raw JSON</button>
      <button class="tab" onclick="switchTab('params')">🔍 Query Params</button>
      <button class="tab" id="dynamicTabBtn" onclick="switchTab('dynamic')" style="display:none; color:#fbbf24;">✨ Smart App Form</button>
    </div>
    <div class="tab-content active" id="tab-form">
      <form id="formBuilder" onsubmit="event.preventDefault(); sendRequest();" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0"></form>
    </div>
    <div class="tab-content" id="tab-body">
      <textarea class="body-input" id="bodyInput" placeholder="Request body (JSON)..."></textarea>
    </div>
    <div class="tab-content" id="tab-params">
      <div id="paramsContainer"><div class="var-row"><input placeholder="Key"/><input placeholder="Value"/></div></div>
      <button onclick="addParamRow()" style="margin-top:6px;background:#1e293b;border:1px solid #374151;color:#94a3b8;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:11px">+ Add Param</button>
    </div>
    <div class="tab-content" id="tab-dynamic">
      <div id="dynamicFormContainer" style="display:flex;flex-direction:column;gap:12px;"></div>
    </div>
  </div>

  <div class="response-panel" id="responsePanel">
    <div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      <p>Send a request to see the response here</p>
    </div>
  </div>
</div>

function buildFormUI(endpoint) {
  const formBuilder = document.getElementById('formBuilder');
  formBuilder.innerHTML = '';
  
  // Get form definition, or create default if not defined
  const formDef = FORM_DEFINITIONS[endpoint.path] || [];
  
  if (formDef.length === 0) {
    formBuilder.innerHTML = '<p style="color:#64748b;grid-column:1/-1">This endpoint doesn\'t require request body parameters</p>';
    return;
  }
  
  formDef.forEach(field => {
    const fieldContainer = document.createElement('div');
    fieldContainer.style.cssText = 'display:flex;flex-direction:column;gap:6px';
    
    const label = document.createElement('label');
    label.textContent = field.label + (field.required ? ' *' : '');
    label.style.cssText = 'font-size:12px;color:#94a3b8;font-weight:600';
    
    let inputElement;
    if (field.type === 'textarea') {
      inputElement = document.createElement('textarea');
      inputElement.className = 'body-input';
      inputElement.style.height = '100px';
    } else if (field.type === 'select') {
      inputElement = document.createElement('select');
      inputElement.innerHTML = `<option value="">${field.placeholder || 'Select...'}</option>`;
      (field.options || []).forEach(opt => {
        const option = document.createElement('option');
        option.value = opt;
        option.textContent = opt.charAt(0).toUpperCase() + opt.slice(1).replace(/_/g,' ');
        inputElement.appendChild(option);
      });
      inputElement.style.cssText = 'background:#0f1117;border:1px solid #374151;color:#e2e8f0;padding:8px;border-radius:6px;font-size:12px;cursor:pointer';
    } else {
      inputElement = document.createElement('input');
      inputElement.type = field.type || 'text';
      inputElement.placeholder = field.placeholder || '';
    }
    
    if (inputElement.tagName !== 'SELECT') {
      inputElement.style.cssText = 'background:#0f1117;border:1px solid #374151;color:#e2e8f0;padding:8px;border-radius:6px;font-size:12px';
      if (field.type === 'file') {
        inputElement.style.padding = '4px';
        if (field.accept) inputElement.accept = field.accept;
        if (field.multiple) inputElement.multiple = true;
      }
    }
    
    inputElement.id = `form-${field.name}`;
    inputElement.name = field.name;
    inputElement.dataset.fieldName = field.name;
    inputElement.dataset.required = field.required;
    
    fieldContainer.appendChild(label);
    fieldContainer.appendChild(inputElement);
    formBuilder.appendChild(fieldContainer);
  });
}

function getFormData() {
  const formElement = document.getElementById('formBuilder');
  const formData = new FormData(formElement);
  
  let hasFiles = false;
  let formHasData = false;
  
  for (const [key, value] of formData.entries()) {
    if (value instanceof File) {
      if (value.name !== '') {
        hasFiles = true;
        formHasData = true;
      }
    } else {
      if (value.trim() !== '') {
        formHasData = true;
      }
    }
  }
  
  if (!formHasData) return null;
  
  if (hasFiles) {
    const finalFormData = new FormData();
    for (const [key, value] of formData.entries()) {
      if (value instanceof File) {
        if (value.name !== '') finalFormData.append(key, value);
      } else {
        if (value.trim() !== '') {
          if ((key === 'proofImages' || key === 'targetWards' || key === 'documentNames') && value.includes(',')) {
            value.split(',').forEach(v => finalFormData.append(key, v.trim()));
          } else {
            finalFormData.append(key, value);
          }
        }
      }
    }
    return finalFormData;
  } else {
    const params = new URLSearchParams();
    for (const [key, value] of formData.entries()) {
      if (value.trim() !== '') {
        if ((key === 'proofImages' || key === 'targetWards' || key === 'documentNames') && value.includes(',')) {
          value.split(',').forEach(v => params.append(key, v.trim()));
        } else {
          params.append(key, value);
        }
      }
    }
    return params;
  }
}

function selectEndpoint(gi, ei) {
  document.querySelectorAll('.endpoint-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`ep-${gi}-${ei}`).classList.add('active');
  currentEndpoint = ENDPOINTS[gi].items[ei];
  const ep = currentEndpoint;
  document.getElementById('reqTitle').textContent = ep.name;
  document.getElementById('reqSubtitle').textContent = ep.auth ? '🔒 Requires Authentication' : '🌐 Public endpoint';
  const base = ep.base || document.getElementById('baseUrl').value;
  document.getElementById('reqUrl').value = base + ep.path;
  const badge = document.getElementById('reqMethodBadge');
  badge.textContent = ep.method;
  badge.style.background = colors[ep.method] || '#1e293b';
  badge.style.color = textColors[ep.method] || '#94a3b8';
  document.getElementById('bodyInput').value = ep.body || '';
  
  // Build form for this endpoint
  buildFormUI(ep);
  
  // Show dynamic form tab only for Apply Scheme
  document.getElementById('dynamicTabBtn').style.display = (ep.path === '/scheme-applications' && ep.method === 'POST') ? 'inline-block' : 'none';
  if (ep.path === '/scheme-applications' && ep.method === 'POST') {
    initDynamicForm();
  }
  
  switchTab('form');
  
  document.getElementById('responsePanel').innerHTML = `<div class="empty-state"><p>Click <strong>Send</strong> to run this request</p></div>`;
}

function switchTab(tab) {
  const tabs = ['form','body','params','dynamic'];
  document.querySelectorAll('.tab').forEach((t,i) => {
    if (t) t.classList.toggle('active', tabs[i] === tab);
  });
  document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
  const activeTabContent = document.getElementById(`tab-${tab}`);
  if (activeTabContent) activeTabContent.classList.add('active');
}

    <button onclick="submitDynamicForm()" style="background:#065f46;color:#34d399;border:none;padding:10px 16px;border-radius:6px;cursor:pointer;font-weight:bold;margin-top:12px;display:none" id="dynSubmitBtn">Submit Smart Application</button>
  `;

async function fetchSchemeDocs() {
  const schemeId = document.getElementById('dynSchemeId').value.trim();
  if (!schemeId) return alert('Enter Scheme ID');
  const token = document.getElementById('tokenInput').value.trim();
  const baseUrl = document.getElementById('baseUrl').value;
  
  try {
    const res = await fetch(`${baseUrl}/schemes/${schemeId}`, {
      headers: token ? { 'Authorization': `Bearer ${token}` } : {}
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || 'Failed to fetch scheme');
    
    const docs = data.data?.requiredDocuments || [];
    const fields = data.data?.dynamicFields || [];
    const container = document.getElementById('dynDocsContainer');
    
    let html = '';

    if (docs.length === 0 && fields.length === 0) {
      html = '<p style="color:#a78bfa;font-size:12px;">No documents or dynamic fields required for this scheme.</p>';
    } else {
      if (docs.length > 0) {
        html += '<h4 style="color:#60a5fa;margin-top:8px;">Required Documents</h4>';
        html += docs.map((doc, i) => `
          <div style="background:#1e293b;padding:12px;border-radius:6px;border:1px solid #374151;margin-top:6px;">
            <label style="display:block;font-size:12px;color:#e2e8f0;margin-bottom:6px;font-weight:bold;">
              ${doc.name} ${doc.isRequired ? '<span style="color:#f87171">*</span>' : ''}
            </label>
            <input type="file" accept=".pdf,image/*" id="dyndoc-${i}" data-docname="${doc.name}" ${doc.isRequired ? 'required' : ''} style="color:#94a3b8;font-size:11px;" />
          </div>
        `).join('');
      }

      if (fields.length > 0) {
        html += '<h4 style="color:#fbbf24;margin-top:16px;">Dynamic Fields</h4>';
        html += fields.map((field, i) => {
          let inputHtml = '';
          const reqAttr = field.isRequired ? 'required' : '';
          const reqStar = field.isRequired ? '<span style="color:#f87171">*</span>' : '';
          
          if (field.type === 'select') {
            const opts = (field.options || []).map(opt => `<option value="${opt}">${opt}</option>`).join('');
            inputHtml = `<select class="dyn-field-input" data-fieldname="${field.label}" ${reqAttr} style="width:100%;background:#0f1117;border:1px solid #374151;color:#e2e8f0;padding:8px;border-radius:6px;font-size:12px;cursor:pointer;"><option value="">Select...</option>${opts}</select>`;
          } else if (field.type === 'number') {
            inputHtml = `<input type="number" class="dyn-field-input" data-fieldname="${field.label}" ${reqAttr} placeholder="Enter ${field.label}" style="width:100%;background:#0f1117;border:1px solid #374151;color:#e2e8f0;padding:8px;border-radius:6px;font-size:12px;" />`;
          } else {
            inputHtml = `<input type="text" class="dyn-field-input" data-fieldname="${field.label}" ${reqAttr} placeholder="Enter ${field.label}" style="width:100%;background:#0f1117;border:1px solid #374151;color:#e2e8f0;padding:8px;border-radius:6px;font-size:12px;" />`;
          }

          return `
          <div style="background:#1e293b;padding:12px;border-radius:6px;border:1px solid #374151;margin-top:6px;">
            <label style="display:block;font-size:12px;color:#e2e8f0;margin-bottom:6px;font-weight:bold;">
              ${field.label} ${reqStar}
            </label>
            ${inputHtml}
          </div>
          `;
        }).join('');
      }
    }
    
    container.innerHTML = html;
    document.getElementById('dynSubmitBtn').style.display = 'block';
    
  } catch (err) {
    alert(err.message);
  }
}

async function submitDynamicForm() {
  const schemeId = document.getElementById('dynSchemeId').value.trim();
  const fileInputs = document.querySelectorAll('#dynDocsContainer input[type="file"]');
  const textInputs = document.querySelectorAll('#dynDocsContainer input.dyn-field-input');
  
  const formData = new FormData();
  formData.append('schemeId', schemeId);
  
  const documentNames = [];
  
  for (const input of fileInputs) {
    const file = input.files[0];
    const docName = input.dataset.docname;
    const isRequired = input.hasAttribute('required');
    
    if (isRequired && !file) {
      return alert(`${docName} is required!`);
    }
    
    if (file) {
      formData.append('documents', file);
      documentNames.push(docName);
    }
  }
  
  formData.append('documentNames', JSON.stringify(documentNames));

  const applicationData = {};
  for (const input of textInputs) {
    const fieldName = input.dataset.fieldname;
    const value = input.value.trim();
    if (input.hasAttribute('required') && !value) {
      return alert(`${fieldName} is required!`);
    }
    applicationData[fieldName] = value;
  }

  if (Object.keys(applicationData).length > 0) {
    formData.append('applicationData', JSON.stringify(applicationData));
  }
  
  // Submit
  const token = document.getElementById('tokenInput').value.trim();
  const baseUrl = document.getElementById('baseUrl').value;
  const btn = document.getElementById('dynSubmitBtn');
  btn.textContent = 'Submitting...';
  
  try {
    const res = await fetch(`${baseUrl}/scheme-applications`, {
      method: 'POST',
      headers: token ? { 'Authorization': `Bearer ${token}` } : {},
      body: formData
    });
    const text = await res.text();
    let pretty = text;
    try { pretty = JSON.stringify(JSON.parse(text), null, 2); } catch(e) {}
    
    const statusClass = res.status < 300 ? 'status-2xx' : res.status < 500 ? 'status-4xx' : 'status-5xx';
    document.getElementById('responsePanel').innerHTML = `
      <div class="response-header">
        <span class="status-badge ${statusClass}">${res.status} ${res.statusText}</span>
      </div>
      <pre class="response-body" id="respBody">${escapeHtml(pretty)}</pre>`;
  } catch (err) {
    alert('Error submitting: ' + err.message);
  } finally {
    btn.textContent = 'Submit Smart Application';
  }
}

async function sendRequest() {
  if (!currentEndpoint) return alert('Select an endpoint first');
  const btn = document.getElementById('sendBtn');
  btn.disabled = true; btn.textContent = 'Sending...';
  const token = document.getElementById('tokenInput').value.trim();
  let url = document.getElementById('reqUrl').value.trim();
  const method = currentEndpoint.method;
  const headers = {};
  if (currentEndpoint.auth && token) headers['Authorization'] = `Bearer ${token}`;

  let body = undefined;
  let isFormDataSubmit = false;
  let isUrlEncodedSubmit = false;

  if (['POST','PUT','PATCH','DELETE'].includes(method)) {
    const isFormActive = document.getElementById('tab-form').classList.contains('active');
    
    if (isFormActive) {
      const formData = getFormData();
      if (formData) {
        body = formData;
        if (formData instanceof FormData) {
          isFormDataSubmit = true;
        } else if (formData instanceof URLSearchParams) {
          isUrlEncodedSubmit = true;
        }
      }
    } else {
      // Fall back to raw JSON input
      const raw = document.getElementById('bodyInput').value.trim();
      if (raw && !raw.startsWith('//')) {
        try { body = JSON.stringify(JSON.parse(raw)); } catch(e) { body = raw; }
      }
    }
  }

  if (body !== undefined && !isFormDataSubmit && !isUrlEncodedSubmit) {
    headers['Content-Type'] = 'application/json';
  } else if (isUrlEncodedSubmit) {
    headers['Content-Type'] = 'application/x-www-form-urlencoded';
  }

  const start = Date.now();
  try {
    const res = await fetch(url, { method, headers, body });
    const elapsed = Date.now() - start;
    
    // Check if the response is a file download (CSV or PDF)
    const contentType = res.headers.get('content-type') || '';
    const contentDisposition = res.headers.get('content-disposition') || '';
    const isDownload = contentDisposition.includes('attachment') || contentType.includes('text/csv') || contentType.includes('application/pdf');

    if (isDownload && res.ok) {
      const blob = await res.blob();
      const downloadUrl = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = downloadUrl;
      
      // Try to extract filename from content-disposition
      let filename = 'download';
      if (contentType.includes('csv')) filename += '.csv';
      if (contentType.includes('pdf')) filename += '.pdf';
      
      const filenameMatch = contentDisposition.match(/filename="?([^"]+)"?/);
      if (filenameMatch && filenameMatch[1]) {
        filename = filenameMatch[1];
      }
      
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      window.URL.revokeObjectURL(downloadUrl);
      
      document.getElementById('responsePanel').innerHTML = `
        <div class="response-header">
          <span class="status-badge status-2xx">${res.status} ${res.statusText}</span>
          <span class="response-time">⏱ ${elapsed}ms</span>
        </div>
        <div style="padding: 20px; text-align: center; color: #34d399;">
          <h3 style="margin-bottom: 10px;">✅ File Downloaded Successfully</h3>
          <p>The file <strong>${filename}</strong> has been downloaded to your computer.</p>
        </div>`;
        
      btn.disabled = false; btn.textContent = 'Send';
      return;
    }

    let text = await res.text();
    let pretty = text;
    try { pretty = JSON.stringify(JSON.parse(text), null, 2); } catch(e) {}

    // Auto-capture token
    try {
      const json = JSON.parse(text);
      if (json?.data?.accessToken) {
        document.getElementById('tokenInput').value = json.data.accessToken;
      }
    } catch(e) {}

    const statusClass = res.status < 300 ? 'status-2xx' : res.status < 500 ? 'status-4xx' : 'status-5xx';
    
    let otpBanner = '';
    try {
      const json = JSON.parse(text);
      if (json?.data?.otp) {
        otpBanner = `<div style="background:#065f46;color:#34d399;padding:12px;border-radius:8px;margin-bottom:16px;font-weight:bold;border:1px solid #059669;display:flex;align-items:center;justify-content:space-between;">
          <span>🔐 OTP Generated: <span style="font-size:16px;letter-spacing:2px;background:#022c22;padding:4px 8px;border-radius:4px;margin-left:8px;">${json.data.otp}</span></span>
          <button style="background:#047857;color:white;border:none;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:11px;" onclick="navigator.clipboard.writeText('${json.data.otp}')">Copy OTP</button>
        </div>`;
      }
    } catch(e) {}

    document.getElementById('responsePanel').innerHTML = `
      ${otpBanner}
      <div class="response-header">
        <span class="status-badge ${statusClass}">${res.status} ${res.statusText}</span>
        <span class="response-time">⏱ ${elapsed}ms</span>
        <button class="copy-btn" onclick="navigator.clipboard.writeText(document.getElementById('respBody').textContent)">Copy JSON</button>
      </div>
      <pre class="response-body" id="respBody">${escapeHtml(pretty)}</pre>`;
  } catch(err) {
    document.getElementById('responsePanel').innerHTML = `
      <div class="response-header"><span class="status-badge status-5xx">Network Error</span></div>
      <pre class="response-body" style="color:#f87171">${escapeHtml(err.message)}\n\nMake sure your server is running on the correct port.</pre>`;
  } finally {
    btn.disabled = false; btn.textContent = 'Send';
  }
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
