version: '3.8'

services:
  app:
    build: .
    container_name: mla-grievance-api
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Optional: Local Redis for development
  # Uncomment when ready to add Redis caching
  # redis:
  #   image: redis:7-alpine
  #   container_name: mla-redis
  #   ports:
  #     - "6379:6379"
  #   restart: unless-stopped
