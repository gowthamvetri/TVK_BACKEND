# Rule 1: Worker Processes Optimization
worker_processes auto;
worker_rlimit_nofile 65535; # Allow maximum file descriptors

events {
    # Rule 2: Worker Connections
    worker_connections 10000;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Rule 7: Hide Server Tokens
    server_tokens off;

    # Rule 5: Keepalive Timeout
    keepalive_timeout 65;

    # Rule 6: Client Body Buffer Size
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    
    # Rule 17: Client Max Body Size
    client_max_body_size 20M;

    # File Descriptor Caching for extreme performance
    open_file_cache max=10000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Rule 3: Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # Rule 4: Gzip Proxied
    gzip_proxied any;

    # Rule 19: Rate Limiting Zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Rule 13: API Upstream Block
    upstream backend {
        server mla-grievance-api:5000;
    }

    server {
        listen 80;
        server_name _;

        # Security Headers (Rules 8-12)
        # Rule 8: HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Rule 9: X-Frame-Options
        add_header X-Frame-Options SAMEORIGIN always;
        # Rule 10: X-Content-Type-Options
        add_header X-Content-Type-Options nosniff always;
        # Rule 11: X-XSS-Protection
        add_header X-XSS-Protection "1; mode=block" always;
        # Rule 12: Content Security Policy
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;

        # Standard API Traffic (Rule 1, 9, 14)
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;

            proxy_pass http://backend/api/;
        }

        # WebSocket Support for Socket.IO (Rule 3)
        location /socket.io/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            
            proxy_read_timeout 86400; # Keep WS open
            proxy_pass http://backend/socket.io/;
        }

        # Static Uploads Routing (Rule 7, 8, 9)
        location /uploads/ {
            # Serve directly from NGINX if possible, otherwise proxy
            expires 30d;
            add_header Cache-Control "public, no-transform";
            proxy_pass http://backend/uploads/;
        }

        # Swagger Docs Routing (Rule 9)
        location /api-docs/ {
            proxy_pass http://backend/api-docs/;
        }

        # Health Check Routing (Rule 15)
        location /health {
            access_log off;
            proxy_pass http://backend/health;
        }

        # Fallback
        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_pass http://backend/;
        }
    }

    # HTTPS Server Block (Rule 4)
    # Uncomment and configure certificates for production HTTPS termination
    # server {
    #     listen 443 ssl http2;
    #     server_name mla-backend.example.com;
    #
    #     ssl_certificate /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #
    #     # Copy all location blocks from port 80 server block here
    # }
}
